# Production overlay — use on server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Only exposes the web UI (8080). Postgres, Redis, and trading-engine stay internal.
services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  trading-engine:
    ports: !reset []

  web-app:
    ports:
      - "${WEB_PORT:-8080}:8080"
