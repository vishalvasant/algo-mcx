# Algo-MCX — local development (exposes DB/Redis/engine ports for debugging)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algomcx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algomcx}
      POSTGRES_DB: ${POSTGRES_DB:-algomcx}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algomcx} -d ${POSTGRES_DB:-algomcx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  trading-engine:
    build: ./trading-engine
    env_file:
      - .env
    environment:
      CONFIG_DIR: /app/config
      MIGRATIONS_DIR: /app/db/migrations
      DATABASE_URL: postgresql://${POSTGRES_USER:-algomcx}:${POSTGRES_PASSWORD:-algomcx}@postgres:5432/${POSTGRES_DB:-algomcx}
      REDIS_URL: redis://redis:6379/0
      FLATTRADE_TOKEN_FILE: /app/.flattrade/session.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRADING_MODE: ${TRADING_MODE:-paper}
    volumes:
      - ./config:/app/config:ro
      - ./db/migrations:/app/db/migrations:ro
      - flattrade_data:/app/.flattrade
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ENGINE_PORT:-8002}:8001"
    restart: unless-stopped

  web-app:
    build: ./web-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-algomcx}:${POSTGRES_PASSWORD:-algomcx}@postgres:5432/${POSTGRES_DB:-algomcx}
      TRADING_ENGINE_URL: http://trading-engine:8001
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:-algomcx}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      trading-engine:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  pgdata:
  flattrade_data:
